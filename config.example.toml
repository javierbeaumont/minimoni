[server]
listen        = "0.0.0.0:8080"
# threads       = 8 # HTTP worker threads, one per open dashboard tab; 2-256 (default: 8)
# sse_keepalive = 1 # seconds between SSE keepalives; 1..refresh-1 (default: 1)

[collect]
db        = "/var/lib/minimoni/metrics.db"
interval  = 60                              # seconds between samples (range: 1-3600)
disk_path = "/"

[dashboard]
# title       = "My Server"
# theme       = "auto"      # "auto" | "light" | "dark"; "auto" follows OS preference
# show_footer = true        # show version footer
# refresh     = 30          # SSE push interval in seconds
# ranges      = ["1d", "7d", "30d", "90d"] # largest value sets retention; units: m/h/d

# charts = ["cpu_load", "cpu_usage", "memory", "disk", "temp", "net"]
# cards  = ["cpu_load", "cpu_usage", "memory", "disk", "temp", "net", "uptime"]
# Omit to show all in default order. Set to [] to hide all. Listed order is respected.

# cpu_load_card_unit     = "abs"  # status card: "%" | "abs" (% = normalized by core count)
# cpu_load_chart_unit    = "abs"  # chart Y-axis: "%" | "abs"
# memory_card_unit       = "%"    # status card: "%" | "mb" | "gb"
# memory_chart_unit      = "mb"   # chart Y-axis: "%" | "mb" | "gb"
# disk_card_unit         = "%"    # status card: "%" | "gb" | "tb"
# disk_chart_unit        = "gb"   # chart Y-axis: "%" | "gb" | "tb"
# temp_card_unit         = "c"    # status card: "%" | "c" | "f"
# temp_chart_unit        = "c"    # chart Y-axis: "%" | "c" | "f"
# temp_critical_fallback = 95     # temp % 100% ref when sysfs has no critical trip point (def: 85)
# net_card_unit          = "kb"   # status card: "%" | "kb" | "mb" | "gb" | "kbps" | "mbps" | "gbps"
# net_chart_unit         = "kb"   # chart Y-axis: same values as net_card_unit
# net_max_speed          = 300    # link ceiling in Mbit/s: your real one. The net "%" denominator
#                                 # and the anchor of the 85/98% semaphore. Wins over the sysfs
#                                 # link speed, which is the NIC's, not your uplink (a 1 GbE card
#                                 # on a 300 Mbit line reads 1000). Unset: sysfs, else 1000.
# uptime_unit            = "auto" # uptime display: "auto" | "h" | "d"

[[alert]]
name = "disk-full"
metric = "disk_percent"
operator = ">"
threshold = 90
webhook = "https://ntfy.sh/my-server"
cooldown = "1h"

[[alert]]
name = "high-temp"
metric = "temp_celsius"
operator = ">"
threshold = 80
command = "/usr/local/bin/alert.sh"
cooldown = "30m"
