name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the toolchain image
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-test-${{ hashFiles('tools/Dockerfile') }}
      - name: Load the toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/toolchain.tar"
      - run: make test-unit
      - name: Save the toolchain image
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: docker save -o "$RUNNER_TEMP/toolchain.tar" minimoni-toolchain

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the toolchain image
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-test-${{ hashFiles('tools/Dockerfile') }}
      - name: Load the toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/toolchain.tar"
      - run: make test-integration
      - name: Save the toolchain image
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: docker save -o "$RUNNER_TEMP/toolchain.tar" minimoni-toolchain

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the toolchain image
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-test-${{ hashFiles('tools/Dockerfile') }}
      - name: Load the toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/toolchain.tar"
      - run: make test-e2e
      - name: Save the toolchain image
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: docker save -o "$RUNNER_TEMP/toolchain.tar" minimoni-toolchain
