name: Build and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: linux-amd64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Both archs build the same way: a native Alpine container
      # on a native runner, producing a static musl binary.
      - name: Build (musl)
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            alpine:latest \
            sh -c '
              set -e
              apk add --quiet --no-cache gcc musl-dev make xxd git
              git config --global --add safe.directory /work
              make release
            '

      - name: Rename binary
        run: mv minimoni minimoni-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: minimoni-${{ matrix.arch }}
          path: minimoni-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            minimoni-linux-amd64
            minimoni-linux-arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(head -n 1 RELEASE_NOTES.md | sed 's/^\*\*//;s/\*\*$//')
          tail -n +3 RELEASE_NOTES.md > /tmp/release-body.md
          gh release create ${{ github.ref_name }} \
            --title "$TITLE" \
            --notes-file /tmp/release-body.md \
            minimoni-linux-amd64 \
            minimoni-linux-arm64 \
            config.example.toml
