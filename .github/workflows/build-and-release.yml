name: Build and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all architectures, including armv7 and armv6 (slow, via QEMU)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      # A job-level if: cannot read matrix.*, so the build_all toggle is
      # resolved here into the include list the build job consumes.
      - id: set
        env:
          BUILD_ALL: ${{ github.event_name != 'workflow_dispatch' || inputs.build_all }}
        run: |
          INCLUDE='[
            {"arch":"linux-amd64","runner":"ubuntu-latest","platform":"linux/amd64"},
            {"arch":"linux-arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64"}'
          if [ "$BUILD_ALL" = "true" ]; then
            INCLUDE="$INCLUDE,
            {\"arch\":\"linux-armv7\",\"runner\":\"ubuntu-latest\",\"platform\":\"linux/arm/v7\"},
            {\"arch\":\"linux-armv6\",\"runner\":\"ubuntu-latest\",\"platform\":\"linux/arm/v6\"}"
          fi
          INCLUDE="$INCLUDE]"
          echo "include=$(echo "$INCLUDE" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # QEMU emulation is only needed for the arm32 archs; amd64 and
      # arm64 build natively on their own runners.
      - name: Set up QEMU
        if: matrix.arch == 'linux-armv7' || matrix.arch == 'linux-armv6'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Every arch builds the same way: an Alpine container (pinned by
      # digest in tools/Dockerfile) producing a static musl binary.
      # amd64 and arm64 run natively; armv7 and armv6 run under QEMU.
      - name: Build (musl)
        run: |
          docker build -q --platform ${{ matrix.platform }} --target base \
            -t minimoni-toolchain tools
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/work \
            -w /work \
            minimoni-toolchain \
            sh -c '
              set -e
              git config --global --add safe.directory /work
              make release
            '

      - name: Rename binaries
        run: |
          mv minimoni         minimoni-${{ matrix.arch }}
          mv minimoni-migrate minimoni-migrate-${{ matrix.arch }}

      - name: Upload the built binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.arch }}
          path: |
            minimoni-${{ matrix.arch }}
            minimoni-migrate-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    name: Release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every arch's binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Stage release artifacts
        run: |
          mkdir dist
          cp \
            minimoni-linux-* \
            minimoni-migrate-linux-* \
            config.example.toml \
            sbom.cdx.json \
            contrib/systemd/*.service \
            contrib/systemd/*.timer \
            dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env: a ${{ }} inside the run block is substituted as text, and
          # git allows shell metacharacters in a tag name. actionlint does not
          # treat ref_name as untrusted, so nothing warns if this moves down.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # The official semver.org regex, verbatim, with a "v" prefix. It is PCRE
          # (\d, non-capturing groups), so it needs grep -P: bash's =~ is ERE.
          SEMVER='^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          if ! printf '%s\n' "$TAG_NAME" | grep -Pq "$SEMVER"; then
            echo "refusing to release from tag '$TAG_NAME': not semver (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          TITLE=$(head -n 1 RELEASE_NOTES.md | sed 's/^\*\*//;s/\*\*$//')
          tail -n +3 RELEASE_NOTES.md > /tmp/release-body.md
          gh release create "$TAG_NAME" \
            --title "$TITLE" \
            --notes-file /tmp/release-body.md \
            dist/*
