<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <title>minimoni</title>
  <!-- Replaced with inline data URI by tools/bundle.sh at build time -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Replaced with inline <style> by tools/bundle.sh at build time -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- --- Header: title, uptime, range tabs, theme toggle --- -->
  <header>
    <div>
      <h1 id="ttl">minimoni</h1>
      <div class="sub-row">
        <span class="sub" id="upt"></span>
        <!-- SSE connection status dot: sits next to uptime (both are
             "system state" info). Tooltip text comes from aria-label. -->
        <span id="conn" class="conn down" role="status" aria-label="Connecting..."></span>
      </div>
    </div>
    <div class="hdr-right">
      <div class="ranges" id="rngs"></div>
      <button id="thm">&#9728; Light</button>
    </div>
  </header>
  <!-- --- Metric cards (visibility and order driven by server config) --- -->
  <div class="cards">
    <div class="card hide" id="c-load">
      <div class="clabel">CPU Load
        <span class="card-unit s-load1" data-series="0">1m</span>
        <span class="card-unit hide s-load5" data-series="1">5m</span>
        <span class="card-unit hide s-load15" data-series="2">15m</span>
      </div>
      <div class="cval">&#8212;</div>
      <div class="csub">
        <span class="card-sub hide" data-card="load" data-idx="0"><span class="card-sub-lbl s-load1">1m</span> <span class="card-sub-val"></span></span>
        <span class="card-sub" data-card="load" data-idx="1"><span class="card-sub-lbl s-load5">5m</span> <span class="card-sub-val"></span></span>
        <span class="card-sub" data-card="load" data-idx="2"><span class="card-sub-lbl s-load15">15m</span> <span class="card-sub-val"></span></span>
      </div>
    </div>
    <div class="card hide" id="c-cpu">
      <div class="clabel">CPU Usage
        <span class="card-unit s-cpu-user" data-series="0">user</span>
        <span class="card-unit hide s-cpu-sys" data-series="1">sys</span>
      </div>
      <div class="cval">&#8212;</div>
      <div class="csub">
        <span class="card-sub hide" data-card="cpu" data-idx="0"><span class="card-sub-lbl s-cpu-user">user</span> <span class="card-sub-val"></span></span>
        <span class="card-sub" data-card="cpu" data-idx="1"><span class="card-sub-lbl s-cpu-sys">sys</span> <span class="card-sub-val"></span></span>
      </div>
    </div>
    <div class="card hide" id="c-mem">
      <div class="clabel">Memory
        <span class="card-unit s-mem-used" data-series="0">used</span>
        <span class="card-unit hide s-mem-avail" data-series="1">avail</span>
      </div>
      <div class="cval">&#8212;</div>
      <div class="csub">
        <span class="card-sub hide" data-card="mem" data-idx="0"><span class="card-sub-lbl s-mem-used">used</span> <span class="card-sub-val"></span></span>
        <span class="card-sub" data-card="mem" data-idx="1"><span class="card-sub-lbl s-mem-avail">avail</span> <span class="card-sub-val"></span></span>
      </div>
    </div>
    <div class="card hide" id="c-disk">
      <div class="clabel">Disk
        <span class="card-unit s-disk-used" data-series="0">used</span>
        <span class="card-unit hide s-disk-free" data-series="1">free</span>
      </div>
      <div class="cval">&#8212;</div>
      <div class="csub">
        <span class="card-sub hide" data-card="disk" data-idx="0"><span class="card-sub-lbl s-disk-used">used</span> <span class="card-sub-val"></span></span>
        <span class="card-sub" data-card="disk" data-idx="1"><span class="card-sub-lbl s-disk-free">free</span> <span class="card-sub-val"></span></span>
      </div>
    </div>
    <!-- Temperature card: like the others, shown once the server includes its
         field ("temp"); a null reading still shows it with a dash. The empty
         .csub keeps the row structure identical to the other cards so the
         value lines up vertically with its neighbours. -->
    <div class="card hide" id="c-temp">
      <div class="clabel">Temp</div>
      <div class="cval">&#8212;</div>
      <div class="csub"></div>
    </div>
    <div class="card hide" id="c-net">
      <div class="clabel">Network
        <span class="card-unit s-net-tx" data-series="0">&#8593;</span>
        <span class="card-unit hide s-net-rx" data-series="1">&#8595;</span>
      </div>
      <div class="cval">&#8212;</div>
      <div class="csub">
        <span class="card-sub hide" data-card="net" data-idx="0"><span class="card-sub-lbl s-net-tx">&#8593;</span> <span class="card-sub-val"></span></span>
        <span class="card-sub" data-card="net" data-idx="1"><span class="card-sub-lbl s-net-rx">&#8595;</span> <span class="card-sub-val"></span></span>
      </div>
    </div>
  </div>
  <!-- --- Chart panels (visibility and order driven by server config) --- -->
  <div class="charts">
    <div class="cbox" id="b-load">
      <div class="chdr">
        <span class="ctitle">CPU Load</span>
        <div class="legend" id="leg-g-load" data-chart="g-load">
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="1m series" data-series="0"><span class="leg-dot s-load1"></span>1m</span>
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="5m series" data-series="1"><span class="leg-dot s-load5"></span>5m</span>
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="15m series" data-series="2"><span class="leg-dot s-load15"></span>15m</span>
        </div>
      </div>
      <canvas id="g-load" role="img" aria-label="CPU Load history chart"></canvas>
    </div>
    <div class="cbox" id="b-cpu">
      <div class="chdr">
        <span class="ctitle">CPU Usage</span>
        <div class="legend" id="leg-g-cpu" data-chart="g-cpu">
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="user series" data-series="0"><span class="leg-dot s-cpu-user"></span>user</span>
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="sys series" data-series="1"><span class="leg-dot s-cpu-sys"></span>sys</span>
        </div>
      </div>
      <canvas id="g-cpu" role="img" aria-label="CPU Usage history chart"></canvas>
    </div>
    <div class="cbox" id="b-mem">
      <div class="chdr">
        <span class="ctitle">Memory</span>
        <div class="legend" id="leg-g-mem" data-chart="g-mem">
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="used series" data-series="0"><span class="leg-dot s-mem-used"></span>used</span>
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="avail series" data-series="1"><span class="leg-dot s-mem-avail"></span>avail</span>
        </div>
      </div>
      <canvas id="g-mem" role="img" aria-label="Memory history chart"></canvas>
    </div>
    <div class="cbox" id="b-disk">
      <div class="chdr">
        <span class="ctitle">Disk</span>
        <div class="legend" id="leg-g-disk" data-chart="g-disk">
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="used series" data-series="0"><span class="leg-dot s-disk-used"></span>used</span>
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="free series" data-series="1"><span class="leg-dot s-disk-free"></span>free</span>
        </div>
      </div>
      <canvas id="g-disk" role="img" aria-label="Disk history chart"></canvas>
    </div>
    <!-- Temperature panel: hidden by default; shown only when pts contain
         at least one non-null temperature sample -->
    <div class="cbox hide" id="b-temp">
      <div class="chdr"><span class="ctitle">Temperature</span></div>
      <canvas id="g-temp" role="img" aria-label="Temperature history chart"></canvas>
    </div>
    <div class="cbox" id="b-net">
      <div class="chdr">
        <span class="ctitle">Network</span>
        <div class="legend" id="leg-g-net" data-chart="g-net">
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="rx series" data-series="0"><span class="leg-dot s-net-rx"></span>&#8595;</span>
          <span class="leg-item" tabindex="0" role="checkbox" aria-checked="true" aria-label="tx series" data-series="1"><span class="leg-dot s-net-tx"></span>&#8593;</span>
        </div>
      </div>
      <canvas id="g-net" role="img" aria-label="Network history chart"></canvas>
    </div>
  </div>
  <!-- --- Footer: shown only when show_footer=true in server config --- -->
  <footer id="ftr" class="hide">
    <a href="https://github.com/javierbeaumont/minimoni"
       target="_blank" rel="noopener noreferrer">minimoni</a>
    <span id="ftr-ver"></span> - zero-dependency system monitoring
  </footer>

  <!-- Tooltip panel: follows the cursor over a chart. When locked, the values
       come from the locked timestamp on whichever chart is hovered. -->
  <div id="tt" class="hide" aria-hidden="true"></div>

  <!-- Replaced with inline <script> by tools/bundle.sh at build time -->
  <script src="app.js"></script>
</body>
</html>
